<!doctype html>
<html lang="en">
  <head>

      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob:; font-src data: blob:; media-src data: blob:; connect-src blob:; form-action 'none'; base-uri 'self'"

    <script src="/typst/jszip.min.js"></script>
