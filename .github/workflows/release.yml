name: Release

# Builds all six targets through ci.yml, then drafts a GitHub Release. It never pushes a tag
# and never publishes: a person reviews the draft and publishes it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.3.0
        required: true
        type: string

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2

jobs:
  verify-tag:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: The tag exists and equals the package version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git rev-parse --verify "refs/tags/$TAG" > /dev/null
          bun scripts/release.ts check-tag "$TAG"

  checks:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.verify-tag.outputs.tag }}
    secrets: inherit

  publish:
    needs: [verify-tag, checks]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.verify-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-tag.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-input

      - name: Assemble the ten installers, notices and checksums
        run: bun scripts/release.ts finalize release-input release-final

      - name: Write the release notes
        run: |
          {
            echo "Lumo ${TAG#v}: a local PDF and EPUB reader with page translation."
            echo
            echo "## Downloads"
            echo
            echo "| System | Download | Needs |"
            echo "| --- | --- | --- |"
            echo "| Windows x64 / ARM64 | lumo-${TAG}-windows-<arch>-setup.exe | Windows 10 1809 or newer on x64, Windows 11 on ARM64; the WebView2 runtime is bundled |"
            echo "| macOS Intel, Apple silicon | lumo-${TAG}-macos-<arch>.dmg | macOS 13 or newer |"
            echo "| Linux x64, ARM64 | lumo-${TAG}-linux-<arch>.deb, .rpm, .AppImage | A desktop session, a default browser and WebKitGTK 4.1 (Ubuntu 22.04 or Debian 12 or newer) |"
            echo
            echo "Install, first launch, uninstall and the SmartScreen / Gatekeeper prompts are described in the README. Your library and credentials live in the data directory and are kept when you uninstall or upgrade."
            echo
            echo "## Signing status of this release"
            echo
            echo '```'
            cat release-final/SIGNING.txt
            echo '```'
            echo
            echo "Verify downloads with SHA256SUMS. LICENSE and THIRD_PARTY_NOTICES.txt are attached."
          } > release-notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" release-final/* \
            --draft --verify-tag \
            --title "Lumo $TAG" \
            --notes-file release-notes.md
