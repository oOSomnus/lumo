name: CI

# Also called by release.yml, so a release builds exactly what a pull request builds.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref to build; empty means the event's own ref
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.2
  RUST_VERSION: 1.98.1

jobs:
  desktop:
    name: ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, triple: x86_64-pc-windows-msvc, e2e: true }
          - { os: windows-11-arm, triple: aarch64-pc-windows-msvc, e2e: false }
          - { os: macos-15-intel, triple: x86_64-apple-darwin, e2e: true }
          - { os: macos-15, triple: aarch64-apple-darwin, e2e: false }
          - { os: ubuntu-22.04, triple: x86_64-unknown-linux-gnu, e2e: true }
          - { os: ubuntu-22.04-arm, triple: aarch64-unknown-linux-gnu, e2e: false }
    env:
      # The AppImage tooling needs FUSE; extract-and-run works without it.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.triple }}

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev libxdo-dev \
            libayatana-appindicator3-dev libfuse2 \
            xvfb dbus-x11 xdg-utils

      - run: bun install --frozen-lockfile

      - name: Prepare PDF.js and Typst assets
        run: |
          bun run prepare:pdfjs
          bun run prepare:typst

      - run: bun run typecheck
      - run: bun test

      # The only step that sees signing secrets, and never on pull requests. Complete sets sign the
      # build; partial sets fail it (scripts/signing.ts). Each platform gets only its own group.
      - name: Build the app and installers
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ runner.os == 'Windows' && github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ runner.os == 'Windows' && github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ runner.os == 'Windows' && github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE_THUMBPRINT || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ runner.os == 'Windows' && github.event_name != 'pull_request' && secrets.WINDOWS_TIMESTAMP_URL || '' }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_PRIVATE_KEY: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_API_PRIVATE_KEY || '' }}
        run: |
          if [ "$RUNNER_OS" = macOS ] && [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            umask 077
            trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"' EXIT
            printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          fi
          bun run build --target ${{ matrix.triple }}

      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Sidecar smoke test
        run: bun scripts/smoke-desktop.ts --target ${{ matrix.triple }}

      - name: Collect installers
        run: bun scripts/release.ts collect --target ${{ matrix.triple }}

      # What a user gets, not just what was built.
      - name: Check the macOS app bundle
        if: runner.os == 'macOS'
        run: |
          app="src-tauri/target/${{ matrix.triple }}/release/bundle/macos/Lumo.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements :- "$app/Contents/MacOS/lumo-server" > entitlements.xml 2>/dev/null
          grep -q "com.apple.security.cs.allow-jit" entitlements.xml
          grep -q "com.apple.security.cs.allow-unsigned-executable-memory" entitlements.xml
          if grep -q "disable-library-validation\|allow-dyld-environment-variables" entitlements.xml; then
            echo "the sidecar must not carry broader entitlements than Bun needs" >&2
            exit 1
          fi
          bun scripts/smoke-desktop.ts --target ${{ matrix.triple }} --binary "$app/Contents/MacOS/lumo-server"

      - name: Install the Windows setup silently and run the installed app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem "dist/release/${{ matrix.triple }}" -Filter "*-setup.exe" | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "Lumo"
          if (-not (Test-Path (Join-Path $dir "lumo-server.exe"))) { throw "installed sidecar missing in $dir" }
          if (-not (Test-Path (Join-Path $dir "LICENSE"))) { throw "LICENSE was not installed" }
          bun scripts/smoke-desktop.ts --target ${{ matrix.triple }} --binary (Join-Path $dir "lumo-server.exe")
          $env:LUMO_DATA_DIR = Join-Path $env:RUNNER_TEMP "panel-data"
          $panel = Start-Process -FilePath (Join-Path $dir "lumo.exe") -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Get-Process lumo-server -ErrorAction SilentlyContinue)) {
            if ((Get-Date) -gt $deadline) { throw "the panel did not start the sidecar" }
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $panel.Id -Force
          Stop-Process -Name lumo-server -Force -ErrorAction SilentlyContinue
          & (Join-Path $dir "uninstall.exe") /S
          $deadline = (Get-Date).AddSeconds(60)
          while (Test-Path (Join-Path $dir "lumo.exe")) {
            if ((Get-Date) -gt $deadline) { throw "uninstall left the app behind" }
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path $env:LUMO_DATA_DIR)) { throw "the data directory disappeared" }

      - name: Install the Debian package and run the panel
        if: runner.os == 'Linux'
        run: |
          deb="$(ls dist/release/${{ matrix.triple }}/*.deb)"
          dpkg-deb -I "$deb" | grep -E "Depends:.*libwebkit2gtk-4.1-0"
          sudo apt-get install -y "$deb"
          test -x /usr/bin/lumo && test -x /usr/bin/lumo-server
          bun scripts/smoke-desktop.ts --target ${{ matrix.triple }} --binary /usr/bin/lumo-server
          export LUMO_DATA_DIR="$RUNNER_TEMP/panel-data" WEBKIT_DISABLE_DMABUF_RENDERER=1
          xvfb-run -a dbus-run-session -- bash -c '
            lumo & app=$!
            for _ in $(seq 60); do pgrep -x lumo-server >/dev/null && break; sleep 1; done
            pgrep -x lumo-server >/dev/null || { echo "the panel did not start the sidecar" >&2; exit 1; }
            kill -TERM $app
            for _ in $(seq 30); do pgrep -x lumo-server >/dev/null || exit 0; sleep 1; done
            echo "the sidecar outlived the panel" >&2; exit 1'
          sudo apt-get remove -y lumo
          test -d "$LUMO_DATA_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.triple }}
          path: dist/release/${{ matrix.triple }}/*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/setup-node@v4
        if: matrix.e2e
        with:
          node-version: 22

      - name: Playwright library and EPUB tests, source and standalone
        if: matrix.e2e
        run: |
          bunx playwright install --with-deps chromium
          bun run test:e2e --project=source --project=standalone library.e2e.ts epub.e2e.ts
