name: CI

# One Linux job for pull requests and main. Also called by release.yml, so a release runs the
# same checks; the native six-target build lives in desktop.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref to check; empty means the event's own ref
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.2

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Prepare PDF.js and Typst assets
        run: |
          bun run prepare:pdfjs
          bun run prepare:typst

      - run: bun run typecheck
      - run: bun test

      - name: Build and smoke the standalone server
        run: |
          bun scripts/build.ts
          bun scripts/smoke-desktop.ts --target x86_64-unknown-linux-gnu

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Playwright library and EPUB tests, source and standalone
        run: |
          bunx playwright install --with-deps chromium
          bun run test:e2e --project=source --project=standalone library.e2e.ts epub.e2e.ts
