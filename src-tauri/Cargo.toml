[package]
name = "lumo"
version = "0.4.1"
description = "Lumo desktop launcher"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "lumo_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-shell = "=2.6.0"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
